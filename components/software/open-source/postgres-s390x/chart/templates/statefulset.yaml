{{- $instanceName := default .Release.Name .Values.instance.name -}}
{{- $serviceName := printf "postgres-%s" $instanceName -}}
{{- $statefulSetName := printf "postgres-%s" $instanceName -}}
{{- $secretName := printf "postgres-%s" $instanceName -}}
{{- $configMapName := printf "postgres-%s" $instanceName -}}
{{- $namespace := default .Release.Namespace .Values.namespaceOverride -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $statefulSetName }}
  namespace: {{ $namespace }}
  labels:
    app: {{ .Values.commonLabels.app | quote }}
    service-type: {{ index .Values.commonLabels "service-type" | quote }}
    instance: {{ $instanceName | quote }}
    managed-by: byop-broker
    environment: {{ .Values.instance.environment | quote }}
    {{- range $key, $value := .Values.commonLabels }}
    {{- if and (ne $key "app") (ne $key "service-type") }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  annotations:
    byop.ibm.com/instance-id: {{ .Values.instance.id | quote }}
    byop.ibm.com/service-type: "postgres-s390x"
    byop.ibm.com/cluster: {{ .Values.instance.clusterName | quote }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  serviceName: {{ $serviceName }}
  replicas: {{ .Values.statefulset.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.commonLabels.app | quote }}
      instance: {{ $instanceName | quote }}
  template:
    metadata:
      labels:
        app: {{ .Values.commonLabels.app | quote }}
        instance: {{ $instanceName | quote }}
        service-type: {{ index .Values.commonLabels "service-type" | quote }}
        managed-by: byop-broker
        environment: {{ .Values.instance.environment | quote }}
        {{- range $key, $value := .Values.commonLabels }}
        {{- if and (ne $key "app") (ne $key "service-type") }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      annotations:
        byop.ibm.com/instance-id: {{ .Values.instance.id | quote }}
        byop.ibm.com/service-type: "postgres-s390x"
        byop.ibm.com/cluster: {{ .Values.instance.clusterName | quote }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext.pod }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.container.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext.container }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: postgres
          env:
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: postgres-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName }}
                  key: database
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- with .Values.container.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
